<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ثبت اقدام ماهانه</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#1F3B57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#1F3B57; --navy-2:#2C557E; --gold:#C79A3D; --gold-light:#F4E7C9;
    --cream:#FAF7F0; --line:#E3DCC9; --ink:#2A2A28; --muted:#7A7568; --ok:#4C7A4E; --danger:#B4483A; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Vazirmatn', Tahoma, sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  .credit{position:fixed;top:10px;left:14px;font-size:11px;color:var(--muted);background:rgba(250,247,240,.9);padding:4px 10px;border-radius:20px;border:1px solid var(--line);}
  header.top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:28px 20px 46px;position:relative;overflow:hidden;}
  header.top::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg, rgba(199,154,61,.06) 0 2px, transparent 2px 22px);pointer-events:none;}
  .top-inner{max-width:680px;margin:0 auto;position:relative;}
  header.top h1{font-size:clamp(20px,5vw,26px);margin:4px 0 4px;font-weight:800;}
  header.top p{margin:0;color:#D9E3EE;font-size:13.5px;line-height:1.8;}
  .wrap{max-width:680px;margin:-28px auto 50px;padding:0 16px;position:relative;}
  .card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 6px 24px rgba(31,59,87,.07);padding:20px;margin-bottom:18px;}
  .state-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  select, input[type=text], input[type=password]{font-family:inherit;width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:#FCFBF7;font-size:15px;color:var(--ink);}
  select:focus, input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .pin-input{text-align:center;font-size:26px;letter-spacing:14px;font-weight:800;padding:14px;color:var(--navy);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;}
  .btn-primary{background:var(--navy);color:#fff;width:100%;margin-top:14px;} .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);width:100%;margin-top:8px;}
  .switch-user{display:flex;justify-content:space-between;align-items:center;background:var(--gold-light);color:#8A6A1F;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;}
  .switch-user button{background:none;color:#8A6A1F;font-weight:700;text-decoration:underline;padding:0;font-size:12.5px;}
  .month-row{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FCFBF7;margin-bottom:12px;}
  .month-row.done{border-color:#CFE6CF;background:#F6FBF6;}
  .month-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px;}
  .mo-label{font-weight:700;color:var(--navy);font-size:13.5px;} .mo-skill{color:var(--muted);font-size:11.5px;}
  textarea{width:100%;font-family:inherit;font-size:13.5px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;resize:vertical;min-height:52px;}
  textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .save-hint{font-size:11px;color:var(--muted);margin-top:4px;} .save-hint.saved{color:var(--ok);}
  .pin-error{color:#fff;background:var(--danger);font-size:13px;margin-top:10px;text-align:center;padding:10px 12px;border-radius:9px;font-weight:700;display:none;}
  .pin-error.show{display:block;}
  h2.section{font-size:15px;color:var(--navy);margin:0 0 4px;}
  .section-sub{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.8;}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-light);padding:3px 10px;border-radius:20px;margin-bottom:6px;}
  footer.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:18px;}
</style>
</head>
<body>

<div class="credit">طراح: محمد سیستانی</div>

<header class="top">
  <div class="top-inner">
    <span class="badge" style="background:rgba(255,255,255,.15);color:#F4E7C9;">ثبت اقدام ماهانه</span>
    <h1 id="greeting">در حال بارگذاری...</h1>
    <p id="subtext"></p>
  </div>
</header>

<div class="wrap">
  <div class="card" id="mainCard"><div class="state-msg" id="stateMsg">در حال بارگذاری اطلاعات...</div></div>
</div>

<footer class="foot">این صفحه فقط برای ثبت اقدام اعضای همین کارگروه است. گزارش هرکس فقط با کد ۴ رقمی خودش قابل مشاهده و ویرایشه.</footer>

<script>
const SUPABASE_URL = "https://zbwywbzefebywrycfnhm.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ex0JEqp0gkvCW3oST84PBg_FExBZiyt";
const TABLE_NAME = "members";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TOTAL_MONTHS = 12;
const MONTH_SKILL = {1:"افتتاحیه",2:"دعوت",3:"دعوت",4:"ارتباط‌سازی",5:"ارتباط‌سازی",6:"فروش",7:"فروش",8:"پیگیری",9:"پیگیری",10:"رشد شخصیتی",11:"رشد شخصیتی",12:"اختتامیهٔ سال"};
const MONTH_ORDINAL = ["اول","دوم","سوم","چهارم","پنجم","ششم","هفتم","هشتم","نهم","دهم","یازدهم","دوازدهم"];
const LAST_NAME_KEY = "network_progress_last_name";

function toFa(n){ const map={0:"۰",1:"۱",2:"۲",3:"۳",4:"۴",5:"۵",6:"۶",7:"۷",8:"۸",9:"۹"}; return String(n).split("").map(c=>map[c]!==undefined?map[c]:c).join(""); }
function escapeHtml(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function getParams(){ const p = new URLSearchParams(window.location.search); return { org: p.get('org') }; }
function monthLabel(mo){ return "ماه " + MONTH_ORDINAL[mo-1]; }
function monthSkillLabel(mo){ return MONTH_SKILL[mo] || ''; }

let orgCode = null, allMembers = [], member = null;

async function init(){
  const { org } = getParams();
  if(!org){ showError('این لینک ناقصه. لطفاً لینکی که مسئول کارگروه‌تون فرستاده رو باز کنید.'); return; }
  orgCode = org;
  const { data, error } = await sb.from(TABLE_NAME).select('id,name,leader,type').eq('org_code', org).order('name', { ascending: true });
  if(error){ showError('خطا در بارگذاری اطلاعات. اتصال اینترنت رو بررسی کنید.'); return; }
  allMembers = data || [];
  renderNamePicker();
}

function showError(msg){ document.getElementById('greeting').textContent='خطا'; document.getElementById('subtext').textContent=''; document.getElementById('stateMsg').textContent=msg; }

function renderNamePicker(){
  member = null;
  document.getElementById('greeting').textContent = 'شما کدوم عضو هستید؟';
  document.getElementById('subtext').textContent = 'اسم خودتون رو انتخاب کنید، بعد کد ۴ رقمی خودتون رو وارد کنید.';
  if(!allMembers.length){ document.getElementById('mainCard').innerHTML = `<div class="state-msg">هنوز عضوی توی این کارگروه ثبت نشده.</div>`; return; }
  let lastId=''; try{ lastId = localStorage.getItem(LAST_NAME_KEY+'_'+orgCode) || ''; }catch(e){}
  const options = allMembers.map(m => `<option value="${m.id}" ${m.id===lastId?'selected':''}>${escapeHtml(m.name)} — ${escapeHtml(m.leader)}</option>`).join('');
  document.getElementById('mainCard').innerHTML = `<label>اسم من:</label><select id="namePick"><option value="">— انتخاب کنید —</option>${options}</select><button class="btn-primary" onclick="pickName()">ادامه</button>`;
}

async function pickName(){
  const id = document.getElementById('namePick').value;
  if(!id){ alert('لطفاً اسم خودتون رو انتخاب کنید.'); return; }
  try{ localStorage.setItem(LAST_NAME_KEY+'_'+orgCode, id); }catch(e){}
  document.getElementById('mainCard').innerHTML = `<div class="state-msg">در حال بارگذاری...</div>`;
  const { data, error } = await sb.from(TABLE_NAME).select('*').eq('id', id).eq('org_code', orgCode).maybeSingle();
  if(error || !data){ showError('خطا در بارگذاری اطلاعات عضو.'); return; }
  member = data;
  document.getElementById('subtext').textContent = '';
  if(member.pin) renderEnterPin(); else renderSetPin();
}

function renderSetPin(){
  document.getElementById('greeting').textContent = 'سلام ' + member.name + ' 👋';
  document.getElementById('mainCard').innerHTML = `
    <p style="font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 14px;">این اولین ورود شماست. یک کد ۴ رقمی انتخاب کنید تا دفعات بعد با همین کد وارد بشید.</p>
    <label>کد ۴ رقمی جدید:</label><input type="password" inputmode="numeric" maxlength="4" id="pinNew" class="pin-input" placeholder="----" />
    <label style="margin-top:14px;">تکرار کد:</label><input type="password" inputmode="numeric" maxlength="4" id="pinNewConfirm" class="pin-input" placeholder="----" />
    <div class="pin-error" id="pinErr"></div>
    <button class="btn-primary" onclick="submitSetPin()">ثبت کد و ورود</button>
    <button class="btn-ghost" onclick="renderNamePicker()">بازگشت / انتخاب مجدد اسم</button>
  `;
}

async function submitSetPin(){
  const p1=document.getElementById('pinNew').value.trim(), p2=document.getElementById('pinNewConfirm').value.trim(), err=document.getElementById('pinErr');
  if(!/^\d{4}$/.test(p1)){ err.textContent='❌ کد باید دقیقاً ۴ رقم باشه.'; err.classList.add('show'); return; }
  if(p1!==p2){ err.textContent='❌ دو کد وارد شده یکسان نیستن.'; err.classList.add('show'); return; }
  const { error } = await sb.from(TABLE_NAME).update({ pin: p1 }).eq('id', member.id).eq('org_code', orgCode);
  if(error){ err.textContent='❌ خطا در ذخیرهٔ کد.'; err.classList.add('show'); return; }
  member.pin = p1; renderMemberForm();
}

function renderEnterPin(){
  document.getElementById('greeting').textContent = 'سلام ' + member.name + ' 👋';
  document.getElementById('mainCard').innerHTML = `
    <p style="font-size:13px;color:var(--muted);line-height:1.9;margin:0 0 14px;">کد ۴ رقمی خودتون رو وارد کنید.</p>
    <input type="password" inputmode="numeric" maxlength="4" id="pinEnter" class="pin-input" placeholder="----" />
    <div class="pin-error" id="pinErr"></div>
    <button class="btn-primary" onclick="submitEnterPin()">ورود</button>
    <button class="btn-ghost" onclick="renderNamePicker()">بازگشت / انتخاب مجدد اسم</button>
  `;
  const inp = document.getElementById('pinEnter'); inp.focus();
  inp.addEventListener('keydown', e => { if(e.key==='Enter') submitEnterPin(); });
}

function submitEnterPin(){
  const val = document.getElementById('pinEnter').value.trim().replace(/\s/g,'');
  const err = document.getElementById('pinErr');
  if(val !== String(member.pin).trim()){
    err.textContent = '❌ کد اشتباهه. دوباره امتحان کنید، یا از مسئول کارگروه بخواید کدتون رو بازنشانی کنه.';
    err.classList.add('show');
    document.getElementById('pinEnter').value=''; document.getElementById('pinEnter').focus();
    return;
  }
  renderMemberForm();
}

function switchUser(){ renderNamePicker(); }

function renderMemberForm(){
  document.getElementById('greeting').textContent = 'سلام ' + member.name + ' 👋';
  document.getElementById('subtext').textContent = `مسئول پیگیری شما: ${member.leader} · سطح: ${member.type}`;
  const months = member.months || {};
  const doneCount = Object.values(months).filter(v => String(v||'').trim()).length;
  let html = `<div class="switch-user"><span>شما «${escapeHtml(member.name)}» هستید</span><button onclick="switchUser()">من نیستم / تغییر</button></div>
    <h2 class="section">اقدامات ماهانهٔ شما</h2>
    <p class="section-sub">تا الان ${toFa(doneCount)} از ۱۲ ماه رو ثبت کردید.</p>`;
  for(let mo=1; mo<=TOTAL_MONTHS; mo++){
    const text = months[mo] || ''; const done = text.trim().length > 0;
    html += `<div class="month-row ${done?'done':''}" id="row-${mo}">
      <div class="month-row-head"><span class="mo-label">اقدام ${monthLabel(mo)}</span><span class="mo-skill">محور: ${monthSkillLabel(mo)}</span></div>
      <textarea rows="2" placeholder="اقدامی که این ماه انجام دادید رو بنویسید..." data-month="${mo}" onchange="saveMonth(${mo}, this.value)"></textarea>
      <div class="save-hint" id="hint-${mo}">${done ? '✔ ثبت شده' : ''}</div>
    </div>`;
  }
  document.getElementById('mainCard').innerHTML = html;
  for(let mo=1; mo<=TOTAL_MONTHS; mo++){ document.querySelector(`textarea[data-month="${mo}"]`).value = months[mo] || ''; }
}

async function saveMonth(mo, value){
  const hint = document.getElementById('hint-'+mo);
  hint.textContent = 'در حال ذخیره...'; hint.className = 'save-hint';
  if(!member.months) member.months = {};
  member.months[mo] = value;
  const { error } = await sb.from(TABLE_NAME).update({ months: member.months }).eq('id', member.id).eq('org_code', member.org_code);
  const row = document.getElementById('row-'+mo);
  if(error){ hint.textContent = 'خطا در ذخیره‌سازی — دوباره امتحان کنید'; return; }
  const done = value.trim().length > 0;
  row.classList.toggle('done', done);
  hint.textContent = done ? '✔ ذخیره شد' : '';
  hint.className = 'save-hint saved';
}

init();
</script>
</body>
</html>
