<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ثبت اقدام هفتگی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --navy:#1F3B57;
    --navy-2:#2C557E;
    --gold:#C79A3D;
    --gold-light:#F4E7C9;
    --cream:#FAF7F0;
    --line:#E3DCC9;
    --ink:#2A2A28;
    --muted:#7A7568;
    --ok:#4C7A4E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
  }
  .credit{
    position:fixed;top:10px;left:14px;font-size:11px;color:var(--muted);
    background:rgba(250,247,240,.9);padding:4px 10px;border-radius:20px;border:1px solid var(--line);
  }
  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;padding:28px 20px 46px;position:relative;overflow:hidden;
  }
  header.top::after{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(45deg, rgba(199,154,61,.06) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .top-inner{max-width:680px;margin:0 auto;position:relative;}
  header.top h1{font-size:clamp(20px,5vw,26px);margin:4px 0 4px;font-weight:800;}
  header.top p{margin:0;color:#D9E3EE;font-size:13.5px;line-height:1.8;}
  .wrap{max-width:680px;margin:-28px auto 50px;padding:0 16px;position:relative;}
  .card{
    background:#fff;border-radius:var(--radius);border:1px solid var(--line);
    box-shadow:0 6px 24px rgba(31,59,87,.07);padding:20px;margin-bottom:18px;
  }
  .state-msg{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  select, input[type=text]{
    font-family:inherit;width:100%;padding:11px 14px;border-radius:9px;
    border:1px solid var(--line);background:#FCFBF7;font-size:15px;color:var(--ink);
  }
  select:focus, input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:9px;
    padding:11px 18px;font-size:14px;font-weight:700;
  }
  .btn-primary{background:var(--navy);color:#fff;width:100%;margin-top:14px;}
  .btn-primary:hover{background:var(--navy-2);}
  .switch-user{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--gold-light);color:#8A6A1F;padding:10px 14px;border-radius:10px;
    font-size:12.5px;margin-bottom:16px;
  }
  .switch-user button{background:none;color:#8A6A1F;font-weight:700;text-decoration:underline;padding:0;font-size:12.5px;}
  .week-row{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FCFBF7;margin-bottom:12px;}
  .week-row.done{border-color:#CFE6CF;background:#F6FBF6;}
  .week-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px;}
  .wk-label{font-weight:700;color:var(--navy);font-size:13.5px;}
  .wk-skill{color:var(--muted);font-size:11.5px;}
  textarea{
    width:100%;font-family:inherit;font-size:13.5px;padding:9px 12px;border-radius:9px;
    border:1px solid var(--line);background:#fff;resize:vertical;min-height:52px;
  }
  textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .save-hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .save-hint.saved{color:var(--ok);}
  h2.section{font-size:15px;color:var(--navy);margin:0 0 4px;}
  .section-sub{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.8;}
  .badge{
    display:inline-block;font-size:11px;font-weight:700;color:var(--gold);
    background:var(--gold-light);padding:3px 10px;border-radius:20px;margin-bottom:6px;
  }
  footer.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:18px;}
</style>
</head>
<body>

<div class="credit">طراح: محمد سیستانی</div>

<header class="top">
  <div class="top-inner">
    <span class="badge" style="background:rgba(255,255,255,.15);color:#F4E7C9;">ثبت اقدام هفتگی</span>
    <h1 id="greeting">در حال بارگذاری...</h1>
    <p id="subtext"></p>
  </div>
</header>

<div class="wrap">
  <div class="card" id="mainCard">
    <div class="state-msg" id="stateMsg">در حال بارگذاری اطلاعات...</div>
  </div>
</div>

<footer class="foot">این صفحه فقط برای ثبت اقدام اعضای همین سازمان است.</footer>

<script>
const SUPABASE_URL = "https://zbwywbzefebywrycfnhm.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ex0JEqp0gkvCW3oST84PBg_FExBZiyt";
const TABLE_NAME = "members";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const WEEK_SKILL = {
  1:"افتتاحیه", 2:"دعوت", 3:"دعوت", 4:"ارتباط‌سازی", 5:"ارتباط‌سازی",
  6:"فروش", 7:"فروش", 8:"پیگیری", 9:"پیگیری", 10:"رشد شخصیتی", 11:"رشد شخصیتی", 12:"اختتامیه"
};
const WEEK_ORDINAL = {
  1:"اول", 2:"دوم", 3:"سوم", 4:"چهارم", 5:"پنجم", 6:"ششم",
  7:"هفتم", 8:"هشتم", 9:"نهم", 10:"دهم", 11:"یازدهم", 12:"دوازدهم"
};
const LAST_MEMBER_KEY = "network_progress_last_member";

function toFa(n){
  const map = {0:"۰",1:"۱",2:"۲",3:"۳",4:"۴",5:"۵",6:"۶",7:"۷",8:"۸",9:"۹"};
  return String(n).split("").map(c=>map[c]!==undefined?map[c]:c).join("");
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getParams(){
  const p = new URLSearchParams(window.location.search);
  return { id: p.get('id'), org: p.get('org') };
}

let orgCode = null;
let allMembers = [];
let member = null;

async function init(){
  const { id, org } = getParams();
  if(!org){
    showError('این لینک ناقصه. لطفاً لینکی که لیدرتون توی کانال فرستاده رو باز کنید.');
    return;
  }
  orgCode = org;

  // Backward-compat: direct personal link with id
  if(id){
    const { data, error } = await sb.from(TABLE_NAME).select('*').eq('id', id).eq('org_code', org).maybeSingle();
    if(error || !data){
      showError('این لینک معتبر نیست یا این عضو حذف شده. لطفاً با لیدرتون تماس بگیرید.');
      return;
    }
    member = data;
    renderMemberForm();
    return;
  }

  // Shared link mode: load member list for this org, let user pick their name
  const { data, error } = await sb.from(TABLE_NAME).select('id,name,leader,type').eq('org_code', org).order('name', { ascending: true });
  if(error){
    showError('خطا در بارگذاری اطلاعات سازمان. اتصال اینترنت رو بررسی کنید.');
    return;
  }
  allMembers = data || [];

  // Check if we remember who they were last time on this device
  try{
    const raw = localStorage.getItem(LAST_MEMBER_KEY + '_' + org);
    if(raw){
      const savedId = raw;
      if(allMembers.some(m => m.id === savedId)){
        await loadFullMember(savedId);
        return;
      }
    }
  }catch(e){}

  renderNamePicker();
}

async function loadFullMember(id){
  const { data, error } = await sb.from(TABLE_NAME).select('*').eq('id', id).eq('org_code', orgCode).maybeSingle();
  if(error || !data){
    renderNamePicker();
    return;
  }
  member = data;
  try{ localStorage.setItem(LAST_MEMBER_KEY + '_' + orgCode, id); }catch(e){}
  renderMemberForm();
}

function showError(msg){
  document.getElementById('greeting').textContent = 'خطا';
  document.getElementById('subtext').textContent = '';
  document.getElementById('stateMsg').textContent = msg;
}

function renderNamePicker(){
  document.getElementById('greeting').textContent = 'شما کدوم عضو هستید؟';
  document.getElementById('subtext').textContent = 'اسم خودتون رو از لیست پایین انتخاب کنید تا اقداماتتون رو ثبت کنید.';

  if(!allMembers.length){
    document.getElementById('mainCard').innerHTML = `<div class="state-msg">هنوز عضوی توی این سازمان ثبت نشده. با لیدرتون تماس بگیرید.</div>`;
    return;
  }

  const options = allMembers.map(m => `<option value="${m.id}">${escapeHtml(m.name)} — ${escapeHtml(m.leader)}</option>`).join('');
  document.getElementById('mainCard').innerHTML = `
    <label>اسم من:</label>
    <select id="namePick">
      <option value="">— انتخاب کنید —</option>
      ${options}
    </select>
    <button class="btn-primary" onclick="confirmPick()">تأیید و ورود</button>
  `;
}

async function confirmPick(){
  const id = document.getElementById('namePick').value;
  if(!id){ alert('لطفاً اسم خودتون رو انتخاب کنید.'); return; }
  document.getElementById('mainCard').innerHTML = `<div class="state-msg">در حال بارگذاری...</div>`;
  await loadFullMember(id);
}

function switchUser(){
  try{ localStorage.removeItem(LAST_MEMBER_KEY + '_' + orgCode); }catch(e){}
  member = null;
  renderNamePicker();
}

function renderMemberForm(){
  document.getElementById('greeting').textContent = 'سلام ' + member.name + ' 👋';
  document.getElementById('subtext').textContent = `لیدر شما: ${member.leader} · سطح: ${member.type}`;

  const weeks = member.weeks || {};
  const doneCount = Object.values(weeks).filter(v => String(v||'').trim()).length;

  let html = '';
  if(!getParams().id){
    html += `
      <div class="switch-user">
        <span>شما «${escapeHtml(member.name)}» هستید</span>
        <button onclick="switchUser()">من نیستم / تغییر</button>
      </div>
    `;
  }

  html += `
    <h2 class="section">اقدامات هفتگی شما</h2>
    <p class="section-sub">برای هر هفته، اقدامی که انجام دادید رو بنویسید. می‌تونید هر وقت خواستید برگردید و اضافه یا ویرایشش کنید. تا الان ${toFa(doneCount)} از ۱۲ هفته رو ثبت کردید.</p>
  `;

  for(let w=1; w<=12; w++){
    const text = weeks[w] || '';
    const done = text.trim().length > 0;
    html += `
      <div class="week-row ${done?'done':''}" id="row-${w}">
        <div class="week-row-head">
          <span class="wk-label">اقدام هفتهٔ ${WEEK_ORDINAL[w]}</span>
          <span class="wk-skill">محور: ${WEEK_SKILL[w]}</span>
        </div>
        <textarea rows="2" placeholder="اقدامی که این هفته انجام دادید رو بنویسید..." data-week="${w}" onchange="saveWeek(${w}, this.value)"></textarea>
        <div class="save-hint" id="hint-${w}">${done ? '✔ ثبت شده' : ''}</div>
      </div>
    `;
  }

  document.getElementById('mainCard').innerHTML = html;
  for(let w=1; w<=12; w++){
    const ta = document.querySelector(`textarea[data-week="${w}"]`);
    ta.value = weeks[w] || '';
  }
}

async function saveWeek(w, value){
  const hint = document.getElementById('hint-' + w);
  hint.textContent = 'در حال ذخیره...';
  hint.className = 'save-hint';

  if(!member.weeks) member.weeks = {};
  member.weeks[w] = value;

  const { error } = await sb.from(TABLE_NAME)
    .update({ weeks: member.weeks })
    .eq('id', member.id)
    .eq('org_code', member.org_code);

  const row = document.getElementById('row-' + w);
  if(error){
    console.error(error);
    hint.textContent = 'خطا در ذخیره‌سازی — دوباره امتحان کنید';
    return;
  }
  const done = value.trim().length > 0;
  row.classList.toggle('done', done);
  hint.textContent = done ? '✔ ذخیره شد' : '';
  hint.className = 'save-hint saved';
}

init();
</script>
</body>
</html>
